site_name: Monica Server Stack
site_description: Self-hosted Monica 4 with an MCP server, in one Docker Compose project.
site_url: https://jacob-stokes.github.io/monica-server-stack/
repo_url: https://github.com/Jacob-Stokes/monica-server-stack
repo_name: monica-server-stack
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Getting started:
      - Installer: installer.md
      - Docker Compose: compose.md
  - Using it:
      - How it works: how-it-works.md
      - Connecting AI tools: mcp.md
      - HTTPS: https.md
      - Managing with monica-stack: managing.md
